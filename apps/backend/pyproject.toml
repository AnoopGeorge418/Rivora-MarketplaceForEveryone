[project]
name = "backend"
version = "0.1.0"
description = "A FastAPI project scaffolded with faststrapy."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[all]",
    "uvicorn",
    "asyncpg",
    "sqlalchemy>=2.0.52",
    "alembic>=1.19.1",
    "python-dotenv>=1.2.2",
    "pydantic>=2.13.4",
    "slowapi>=0.1.10",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "poethepoet>=0.48.0",
]



# custom run commands -----------
[tool.black]
target-version = ["py312"]

# development server -----------
[tool.poe.tasks.dev]
cmd = "uv run -m app.main"
help = "Start the FastAPI dev server with hot reload"

# alembic migrations ---------
[tool.poe.tasks.migrate]
cmd = "alembic upgrade head"
help = "Apply all pending Alembic migrations"

[tool.poe.tasks.migrate-down]
cmd = "alembic downgrade -1"
help = "Roll back the last migration"

# makemigration args handle
[tool.poe.tasks.makemigration]
cmd = "alembic revision --autogenerate -m \"${message}\""
args = [{ name = "message", positional = true, required = true }]
help = "Generate a new Alembic migration with a message"


# Formatting ---------
[tool.poe.tasks.format]
cmd = "black ."
help = "Format code with Black"

[tool.poe.tasks.format-check]
cmd = "black --check ."
help = "Check formatting without modifying files"

# freeze packages to requirements.txt file ------
[tool.poe.tasks.freeze]
shell = "uv pip freeze > requirements.txt"
help = "Freeze installed packages to requirements.txt"
